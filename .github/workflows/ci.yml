name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, chat, mail]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `${t[k].pct}%`;
            console.log(`### ${process.env.SVC} service coverage\n| Lines | Statements | Branches | Functions |\n|---|---|---|---|\n| ${row("lines")} | ${row("statements")} | ${row("branches")} | ${row("functions")} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
        env:
          SVC: ${{ matrix.service }}
